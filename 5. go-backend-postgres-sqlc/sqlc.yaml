version: "2"
sql:
  - schema: "internals/database/migrations"
    queries: "internals/database/queries"
    engine: "postgresql"
    gen:
      go:
        package: "repository"        
        out: "internals/database/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: true